AWSTemplateFormatVersion: "2010-09-09"
Description: IssuerGraph container registry. Separate from the site stack because App Runner needs an image to exist before the service can be created.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: issuergraph
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: issuergraph-ecr-uri
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export:
      Name: issuergraph-ecr-arn
